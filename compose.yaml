services:

  backend:
    build: .
    container_name: madara-backend
    ports:
      - "9000:8080"
    depends_on:
      - database

  database:
    image: postgres:16
    container_name: madara-database
    environment:
      POSTGRES_DB: madara_db
      POSTGRES_USER: madara_user
      POSTGRES_PASSWORD: madara_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: